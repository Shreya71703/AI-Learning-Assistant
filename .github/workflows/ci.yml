name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend: Python lint ─────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install ruff

      - name: Ruff lint
        run: ruff check backend/ --ignore E501,E402
        continue-on-error: false

      - name: Python syntax check
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/api/ask.py
          python -m py_compile backend/api/upload.py
          python -m py_compile backend/api/quiz.py
          python -m py_compile backend/api/summary.py
          python -m py_compile backend/api/flashcards.py
          python -m py_compile backend/api/studyplan.py
          python -m py_compile backend/api/auth.py
          python -m py_compile backend/api/documents.py
          python -m py_compile backend/utils/config.py
          python -m py_compile backend/utils/auth_utils.py
          python -m py_compile backend/utils/text_processing.py
          python -m py_compile backend/rag/retriever.py
          python -m py_compile backend/models/schemas.py

  # ── Frontend: Build check ────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Check build output exists
        run: test -d frontend/dist && test -f frontend/dist/index.html

  # ── Keep HuggingFace Space alive (unchanged) ─────────────────────────────────
  keep-alive:
    name: Keep HuggingFace Space Alive
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Ping HuggingFace Space
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}" \
            https://shreya15err2-ai-learning-assistant.hf.space/health \
            || echo "Space unreachable — may be cold-starting"
